format = """
$username\
$hostname\
$directory\
${custom.worktree}\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[custom.worktree]
description = "In a linked git worktree, show <project> ⑂ <worktree-name>"
# git-dir == git-common-dir in a normal checkout; they differ only inside a linked worktree.
when = 'test "$(git rev-parse --git-common-dir 2>/dev/null)" != "$(git rev-parse --git-dir 2>/dev/null)"'
command = 'printf "%s ⑂ %s" "$(basename "$(dirname "$(git rev-parse --git-common-dir)")")" "$(basename "$(git rev-parse --show-toplevel)")"'
format = "[$output]($style) "
style = "bold green"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
